name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A push to a pull request branch reaches this workflow once, through
# pull_request. Without the branch filter above it arrived twice, and the
# matrix made that six jobs rather than two. A superseded run is cancelled,
# since only the head of a branch is being asked about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Three platforms. This library is file system work, and the parts that
  # differ by platform are the parts it is made of: the two-rename swap, the
  # executable bit, symbolic links, the path list separator.
  #
  # fail-fast is off. A failure on one platform is the interesting case, and
  # the answer is usually whether the other two agree with it.
  # ===========================================================================
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Every tool is pinned in mise.toml, so CI and a contributor's machine run
      # the same binaries. test_all.sh checks that mise.toml's go still matches
      # go.mod's toolchain, which golangci-lint is strict about.
      - uses: jdx/mise-action@v2
        with:
          cache: true

      # Tests, lint, declscope shrink (before the analyzer, since what it
      # unexports the analyzer then judges) and declscope, across every module
      # in the repository. A
      # failed build reports zero declscope diagnostics and reads as a clean
      # run, so the script builds before it reads any count.
      #
      # The Windows runner's default shell is PowerShell. The script is written
      # in bash.
      - name: Run the checks
        shell: bash
        run: ./test_all.sh

  # One platform is enough: the report is about which lines run, and that is
  # the same question everywhere.
  #
  # The adapters are modules of their own, so `go test ./...` at the root never
  # enters them. Each module is measured on its own and the four profiles go up
  # as one report: the split is about the module graph a consumer inherits, not
  # about four separate libraries. The example module is left out of both, and
  # of codecov.yml, since it is documentation and covers nothing.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    # id-token: write is what lets the Codecov upload authenticate as this
    # workflow run instead of with a stored token. Nothing else in the job
    # needs it, and the workflow-wide contents: read has to be restated
    # alongside it, since a job's permissions replace the default rather than
    # add to it.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run tests with coverage
        run: |
          for dir in . skillcobra skillurfavev2 skillurfavev3; do
            echo "--- $dir"
            ( cd "$dir" && go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./... )
          done

      # OIDC rather than a CODECOV_TOKEN secret: the repository is public, so
      # there is nothing a token would protect that the run's own identity does
      # not, and one less secret to rotate. A pull request from a fork reaches
      # neither, and uploads without either one.
      #
      # continue-on-error: Codecov being unreachable is not a reason to fail a
      # pull request. The check job is what says whether the code is good.
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt,./skillcobra/coverage.txt,./skillurfavev2/coverage.txt,./skillurfavev3/coverage.txt
          flags: unittests
          name: codecov
          use_oidc: true
        continue-on-error: true
