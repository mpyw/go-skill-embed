name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Three platforms, because this library is file system work and the parts
  # that differ by platform are the parts it is made of: the two-rename swap,
  # the executable bit, symbolic links, the path list separator. Every one of
  # them carried a comment about its platform behaviour that only Linux had
  # ever run.
  #
  # fail-fast is off. A failure on one platform is the interesting case, and
  # the answer is usually whether the other two agree with it.
  # ===========================================================================
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Every tool is pinned in mise.toml, so CI and a contributor's machine run
      # the same binaries. test_all.sh checks that mise.toml's go still matches
      # go.mod's toolchain, which golangci-lint is strict about.
      - uses: jdx/mise-action@v2
        with:
          cache: true

      # Tests, lint and declscope, across every module in the repository. A
      # failed build reports zero declscope diagnostics and reads as a clean
      # run, so the script builds before it reads any count.
      #
      # The Windows runner's default shell is PowerShell, and bash is what the
      # script is written in.
      - name: Run the checks
        shell: bash
        run: ./test_all.sh

  # One platform is enough: the report is about which lines run, and that is
  # the same question everywhere.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
